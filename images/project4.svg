<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <rect width="100%" height="100%" fill="url(#g4)" opacity="0.12" rx="16" />

  <!-- Network Circuit Lines -->
  <g stroke="url(#wireGrad)" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 50,125 L 140,125 M 260,125 L 350,125" />
    <path d="M 140,125 L 200,65 L 260,125" />
    <path d="M 140,125 L 200,185 L 260,125" />
  </g>

  <!-- Glowing background node -->
  <circle cx="200" cy="125" r="50" fill="#f59e0b" opacity="0.2" filter="url(#glow4)" />

  <!-- Central Database Node -->
  <g filter="url(#glow4)">
    <rect x="165" y="95" width="70" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  </g>
  <!-- DB Cylinders -->
  <ellipse cx="200" cy="110" rx="22" ry="5" fill="#f59e0b" opacity="0.8" />
  <path d="M 178,110 A 22,5 0 0,0 222,110 L 222,122 A 22,5 0 0,1 178,122 Z" fill="#d97706" />
  <path d="M 178,122 A 22,5 0 0,0 222,122 L 222,134 A 22,5 0 0,1 178,134 Z" fill="#b45309" />
  <ellipse cx="200" cy="122" rx="22" ry="5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <ellipse cx="200" cy="134" rx="22" ry="5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Side Server Node Left (API) -->
  <rect x="65" y="95" width="60" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
  <circle cx="80" cy="110" r="4" fill="#3b82f6" />
  <rect x="92" y="108" width="22" height="4" rx="1" fill="rgba(255,255,255,0.5)" />
  <circle cx="80" cy="125" r="4" fill="#10b981" />
  <rect x="92" y="123" width="22" height="4" rx="1" fill="rgba(255,255,255,0.5)" />
  <circle cx="80" cy="140" r="4" fill="#ef4444" />
  <rect x="92" y="138" width="22" height="4" rx="1" fill="rgba(255,255,255,0.5)" />

  <!-- Side Server Node Right (Cloud/Web App) -->
  <rect x="275" y="95" width="60" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <!-- Dynamic Web Dashboard Symbol -->
  <path d="M 287,115 L 300,105 L 310,118 L 323,108" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <rect x="287" y="132" width="36" height="12" rx="3" fill="rgba(255,255,255,0.08)" />
  <rect x="292" y="136" width="26" height="4" rx="1" fill="#10b981" opacity="0.8" />
</svg>
