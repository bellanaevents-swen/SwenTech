<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <rect width="100%" height="100%" fill="url(#g2)" opacity="0.15" rx="16" />
  
  <!-- Tech Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="0" y1="125" x2="400" y2="125" />
    <circle cx="200" cy="125" r="80" fill="none" />
    <circle cx="200" cy="125" r="140" fill="none" />
  </g>

  <!-- Glowing background nodes -->
  <circle cx="100" cy="80" r="50" fill="#10b981" opacity="0.25" filter="url(#glow2)" />
  <circle cx="280" cy="170" r="60" fill="#3b82f6" opacity="0.2" filter="url(#glow2)" />

  <!-- Code / IDE Window Mockup -->
  <rect x="50" y="45" width="170" height="160" rx="10" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <circle cx="70" cy="60" r="4" fill="#ef4444" />
  <circle cx="82" cy="60" r="4" fill="#f59e0b" />
  <circle cx="94" cy="60" r="4" fill="#10b981" />
  <!-- Mock code lines -->
  <rect x="70" y="80" width="60" height="6" rx="2" fill="#10b981" opacity="0.8" />
  <rect x="70" y="95" width="100" height="6" rx="2" fill="#3b82f6" opacity="0.8" />
  <rect x="90" y="110" width="80" height="6" rx="2" fill="rgba(255,255,255,0.4)" />
  <rect x="90" y="125" width="110" height="6" rx="2" fill="rgba(255,255,255,0.4)" />
  <rect x="110" y="140" width="70" height="6" rx="2" fill="#f59e0b" opacity="0.8" />
  <rect x="70" y="155" width="50" height="6" rx="2" fill="#10b981" opacity="0.8" />
  <rect x="70" y="170" width="90" height="6" rx="2" fill="rgba(255,255,255,0.2)" />

  <!-- Live Stats UI Card Overlay -->
  <rect x="210" y="75" width="140" height="110" rx="12" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#glow2)" />
  <text x="225" y="100" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="10" font-weight="600">CONVERSION</text>
  <text x="225" y="125" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">+148%</text>
  
  <!-- Mini Graph -->
  <path d="M 225,165 Q 245,145 265,155 T 305,135 T 335,140" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 225,165 Q 245,145 265,155 T 305,135 T 335,140 L 335,170 L 225,170 Z" fill="url(#g2)" opacity="0.15" />
</svg>
