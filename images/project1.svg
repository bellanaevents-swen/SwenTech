<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <rect width="100%" height="100%" fill="url(#g1)" opacity="0.15" rx="16" />
  
  <!-- Grid Lines -->
  <g opacity="0.1">
    <path d="M 0,50 L 400,50 M 0,100 L 400,100 M 0,150 L 400,150 M 0,200 L 400,200" stroke="#ffffff" stroke-width="1" />
    <path d="M 50,0 L 50,250 M 100,0 L 100,250 M 150,0 L 150,250 M 200,0 L 200,250 M 250,0 L 250,250 M 300,0 L 300,250 M 350,0 L 350,250" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Graphic Elements -->
  <circle cx="320" cy="80" r="60" fill="url(#g1)" opacity="0.3" filter="url(#glow)" />
  <circle cx="100" cy="180" r="40" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" />
  
  <!-- Mockup UI Card -->
  <rect x="60" y="50" width="280" height="150" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <!-- Window Controls -->
  <circle cx="85" cy="70" r="5" fill="#ef4444" />
  <circle cx="100" cy="70" r="5" fill="#f59e0b" />
  <circle cx="115" cy="70" r="5" fill="#10b981" />
  
  <!-- Wireframe Shapes -->
  <rect x="85" y="95" width="100" height="15" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="85" y="120" width="140" height="8" rx="2" fill="rgba(255,255,255,0.05)" />
  <rect x="85" y="135" width="80" height="8" rx="2" fill="rgba(255,255,255,0.05)" />
  
  <!-- Design Circle Overlay -->
  <circle cx="270" cy="125" r="35" fill="none" stroke="url(#g1)" stroke-width="3" stroke-dasharray="8,4" />
  <circle cx="270" cy="125" r="20" fill="url(#g1)" opacity="0.8" />
  <path d="M 230,125 L 310,125 M 270,85 L 270,165" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
</svg>
